apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-unmanaged-ai
  namespace: default
  labels:
    app: demo-unmanaged-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-unmanaged-ai
  template:
    metadata:
      labels:
        app: demo-unmanaged-ai
    spec:
      containers:
        - name: fake-openai-client
          image: curlimages/curl:latest
          command: ["sh", "-c", "sleep 3600"]
          env:
            - name: OPENAI_API_KEY_NAME_ONLY
              value: "placeholder"
            - name: AZURE_OPENAI_ENDPOINT_NAME_ONLY
              value: "placeholder"
